name: Build debug APK

# Manual trigger only: this does a full PyTorch model export (demucs-onnx)
# plus an Android SDK/NDK/Gradle build, which is too slow/heavy to run on
# every push. Run it from the Actions tab when a build is needed.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export htdemucs to ONNX
        run: |
          pip install 'demucs-onnx[export]'
          mkdir -p app/src/main/assets
          demucs-onnx export htdemucs app/src/main/assets/htdemucs.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        # android-actions/setup-android@v3 shells out to `sdkmanager tools`,
        # a package Google dropped from the SDK repo; that call now fails
        # outright. Setting up cmdline-tools directly avoids it (same steps
        # verified working by hand in the local dev environment).
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sS -L -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools_tmp"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools_tmp/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
          rm -rf "$SDK_ROOT/cmdline-tools_tmp"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK/NDK/CMake packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: demucs-onnx-poc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
