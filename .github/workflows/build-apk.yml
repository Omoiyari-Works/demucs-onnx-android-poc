name: Build debug APK

# Manual trigger only: this does a full PyTorch model export (demucs-onnx)
# plus an Android SDK/NDK/Gradle build, which is too slow/heavy to run on
# every push. Run it from the Actions tab when a build is needed.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export htdemucs to ONNX
        run: |
          pip install 'demucs-onnx[export]'
          mkdir -p app/src/main/assets
          demucs-onnx export htdemucs app/src/main/assets/htdemucs.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install SDK/NDK/CMake packages
        # ubuntu-latest runners ship with an Android SDK preinstalled
        # (ANDROID_HOME/ANDROID_SDK_ROOT already point at it), but its
        # cmdline-tools/sdkmanager aren't on PATH, hence the explicit path
        # below. Setting a second ANDROID_HOME ourselves made AGP fail
        # outright with "Several environment variables ... contain
        # different paths to the SDK", so this just adds packages to the
        # SDK that's already there instead of installing a separate one.
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: demucs-onnx-poc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
